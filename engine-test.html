<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engine Test</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px 16px; background: #f5f5f7; color: #1d1d1f; }
    h1 { margin: 0 0 4px; } .muted { color: #6e6e73; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; background: #fff; border-radius: 12px; overflow: hidden; }
    td { padding: 8px 12px; border-bottom: 1px solid #e5e5ea; } td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .slices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    figure { margin: 0; background: #fff; border-radius: 12px; padding: 12px; }
    svg { width: 100%; height: auto; } path { fill-rule: evenodd; fill: rgba(0,113,227,.15); stroke: #0071e3; stroke-width: .4; }
    #status { padding: 10px 14px; border-radius: 10px; background: #eef4ff; }
  </style>
</head>
<body>
  <h1>3D engine test</h1>
  <p class="muted">Loads OpenCASCADE in a background worker, builds a test part, slices it into flat outlines, and exports STEP.</p>
  <div id="status">Starting…</div>
  <table id="times"></table>
  <div class="slices" id="slices"></div>
  <script type="module" src="/src/engine/engineTest.ts"></script>
</body>
</html>
